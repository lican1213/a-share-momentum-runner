name: National-team V5 future OHLC and three-arm paper accounts
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['National-team EXP-0012 event router and self-iterating left-side paper']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'scripts/track_national_team_left_entry_v5.py'
      - 'national_team/paper_account_v5.py'
      - 'tests/test_national_team_paper_account_v5.py'
      - 'scripts/check_national_team_schedule_latency.py'
      - 'tests/test_national_team_schedule_latency.py'
      - '.github/workflows/national-team-left-outcomes-v5.yml'
  schedule:
    - cron: '45 10 * * 1-5'
permissions:
  contents: write
concurrency:
  group: national-team-exp0012-outcome
  cancel-in-progress: false
jobs:
  follow-all-events:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Observe scheduler and router-to-outcome delay (non-blocking)
        env:
          UPSTREAM_COMPLETED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          python scripts/check_national_team_schedule_latency.py \
            --cron '45 10 * * 1-5' \
            --upstream-completed-at "$UPSTREAM_COMPLETED_AT"
      - name: Install public future OHLC providers
        run: python -m pip install 'pytest>=8,<10' 'akshare>=1.17,<2' 'baostock>=0.8,<1'
      - name: Validate first-observed future scenarios and feedback
        run: python -m pytest -q tests/test_national_team_event_router_v5.py tests/test_national_team_ohlc_fallback_v5.py tests/test_national_team_schedule_latency.py tests/test_national_team_left_entry_outcomes.py tests/test_national_team_paper_account_v5.py
      - name: Fetch real OHLC, update left/right paper accounts and compare with 510300
        shell: bash
        run: |
          python scripts/track_national_team_left_entry_v5.py \
            --freeze-root records/national_team_left_entry_v5 \
            --max-events 24 \
            --out "$RUNNER_TEMP/v5-outcomes.json" \
            --paper-out "$RUNNER_TEMP/v5-paper-accounts.json" \
            --paper-root records/national_team_paper_accounts_v5
          python - "$RUNNER_TEMP/v5-outcomes.json" "$RUNNER_TEMP/v5-paper-accounts.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding="utf-8"))
          assert j["trade_authorized"] is False and j["broker_orders"]==[]
          for event in j["results"]:
              assert {"SHALLOW_DIP","DEEP_DIP"}.issubset(event["policy_results"])
              assert event["trade_authorized"] is False and event["broker_orders"]==[]
              assert event["source_new_ohlc_sha256"]
          a=json.load(open(sys.argv[2],encoding="utf-8"))
          assert a["trade_authorized"] is False and a["broker_orders"]==[]
          assert set(a["accounts"]) == {"SHALLOW_DIP","DEEP_DIP","R_BOUNCE"}
          assert j["paper_account_snapshot_sha256"] == a["snapshot_sha256"]
          print("V5_PAPER_ACCOUNTS", {k:v["summary"]["equity_after_estimated_exit_cost_cny"] for k,v in a["accounts"].items()})
          PY
      - name: Archive new dated feedback snapshot for tomorrow's router
        shell: bash
        run: |
          set -euo pipefail
          run_date="$(TZ=Asia/Shanghai date +%F)"
          dir="records/national_team_left_outcomes_v5/$run_date"
          paper_dir="records/national_team_paper_accounts_v5/$run_date"
          mkdir -p "$dir" "$paper_dir"
          cp "$RUNNER_TEMP/v5-outcomes.json" "$dir/$GITHUB_RUN_ID-a$GITHUB_RUN_ATTEMPT.json"
          cp "$RUNNER_TEMP/v5-paper-accounts.json" "$paper_dir/$GITHUB_RUN_ID-a$GITHUB_RUN_ATTEMPT.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$dir" "$paper_dir"
          git commit -m "records(exp0014): append V5 three-arm cash ledger and OHLC feedback $GITHUB_RUN_ID [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo 'EXP0014_PAPER_ACCOUNT_PERSISTED'; exit 0
            fi
            sleep 2
          done
          exit 2
