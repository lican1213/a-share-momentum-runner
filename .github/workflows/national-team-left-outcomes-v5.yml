name: National-team EXP-0012 prospective two-policy paper learning
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/track_national_team_left_entry_v5.py'
      - '.github/workflows/national-team-left-outcomes-v5.yml'
  schedule:
    - cron: '45 10 * * 1-5'
permissions:
  contents: write
concurrency:
  group: national-team-exp0012-outcome
  cancel-in-progress: false
jobs:
  follow-all-events:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public future OHLC providers
        run: python -m pip install 'pytest>=8,<10' 'akshare>=1.17,<2'
      - name: Validate first-observed future scenarios and feedback
        run: python -m pytest -q tests/test_national_team_event_router_v5.py tests/test_national_team_left_entry_outcomes.py
      - name: Fetch new real OHLC and compare both paper policies with 510300
        shell: bash
        run: |
          python scripts/track_national_team_left_entry_v5.py \
            --freeze-root records/national_team_left_entry_v5 \
            --max-events 24 \
            --out "$RUNNER_TEMP/v5-outcomes.json"
          python - "$RUNNER_TEMP/v5-outcomes.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding="utf-8"))
          assert j["trade_authorized"] is False and j["broker_orders"]==[]
          for event in j["results"]:
              assert set(event["policy_results"])=={"SHALLOW_DIP","DEEP_DIP"}
              assert event["trade_authorized"] is False and event["broker_orders"]==[]
              assert event["source_new_ohlc_sha256"]
          print("EXP0012_FORWARD_LEARNING",j["tracked_freeze_count"])
          PY
      - name: Archive new dated feedback snapshot for tomorrow's router
        shell: bash
        run: |
          set -euo pipefail
          run_date="$(TZ=Asia/Shanghai date +%F)"
          dir="records/national_team_left_outcomes_v5/$run_date"
          mkdir -p "$dir"
          cp "$RUNNER_TEMP/v5-outcomes.json" "$dir/$GITHUB_RUN_ID-a$GITHUB_RUN_ATTEMPT.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$dir"
          git commit -m "records(exp0012): append actual future OHLC paper feedback $GITHUB_RUN_ID [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo 'EXP0012_FEEDBACK_PERSISTED'; exit 0
            fi
            sleep 2
          done
          exit 2
