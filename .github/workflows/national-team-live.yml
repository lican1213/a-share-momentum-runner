name: National-team four ETF actual exchange data collection
on:
  push:
    branches: [main]
    paths:
      - 'national_team/live_etf_sources.py'
      - 'national_team/record_merge.py'
      - 'national_team/live_stock_watch.py'
      - 'national_team/live_paper_tracker.py'
      - 'national_team/paper_events.py'
      - 'national_team/pcf_official.py'
      - 'national_team/szse_json.py'
      - 'national_team/sse_direct.py'
      - '.github/workflows/national-team-live.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 1-5'
permissions:
  contents: write
concurrency:
  group: nt-etf-live-v2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  four-etf-data:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual data provider
        run: python -m pip install 'akshare>=1.17.0,<2' 'pandas>=2.2,<3' 'openpyxl>=3.1,<4' 'pytest>=8,<10' 'exchange-calendars==4.13.1' 'xlrd>=2,<3'
      - name: Check exchange unit/schema normalization
        run: python -m pytest -q tests/test_national_team_*.py tests/test_szse_json.py
      - name: Collect actual four-ETF shares and NAV with provenance
        run: python -m national_team.live_etf_sources
      - name: Reconcile previous immutable ETF source runs (no fake backdating)
        run: python -m national_team.record_merge
      - name: Build real CSI300 index-weight stock watchlist (index proxy, not ETF PCF)
        shell: bash
        run: |
          set -euo pipefail
          date_beijing=$(TZ=Asia/Shanghai date +%F)
          src="records/national_team_merged/${date_beijing}/${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}.json"
          python -m national_team.live_stock_watch --source "$src" --max-stocks 150
      - name: Freeze first-observed S1 and S2 paper events (no backdated trades)
        shell: bash
        run: |
          set -euo pipefail
          date_beijing=$(TZ=Asia/Shanghai date +%F)
          source="records/national_team_watch/${date_beijing}/${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}.json"
          python -m national_team.paper_events --source "$source"
      - name: Recheck matured frozen paper events with authentic price histories
        run: python -m national_team.live_paper_tracker --max-events 64
      - name: Collect original official SSE PCF for three Shanghai core funds
        run: python -m national_team.pcf_official
      - name: Independent red-team integrity audit of source, merged factors, stock ranking, frozen events
        shell: bash
        run: |
          set -euo pipefail
          date_beijing=$(TZ=Asia/Shanghai date +%F)
          file="${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}.json"
          python -m national_team.audit_gate \
            --source "records/national_team_etf/${date_beijing}/$file" \
            --merged "records/national_team_merged/${date_beijing}/$file" \
            --watch "records/national_team_watch/${date_beijing}/$file" \
            --frozen "records/national_team_events/${date_beijing}/$file"
      - name: Rebuild Agent LLM Wiki MOC from actual national-team run evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/wiki_sync.py
          python scripts/wiki_lint.py
      # Wiki/compiled and indices are derived mutable summaries. Never commit
      # them together with immutable source evidence: concurrent modifications
      # to those paths previously produced Git rebase conflicts.
      - name: Persist unique run evidence to Git history
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Wiki indices and compiled summaries were recomputed earlier solely
          # to validate them. Restore them before source-only rebase: Git
          # otherwise rejects pull --rebase for unstaged derived file changes.
          git restore -- wiki/indices/ wiki/compiled/
          git add -- records/national_team_etf/ records/national_team_merged/ records/national_team_watch/ records/national_team_events/ records/national_team_paper/ records/national_team_pcf/ records/national_team_audits/
          if git diff --staged --quiet; then
            echo 'NO_ETF_EVIDENCE_GENERATED'; exit 0
          fi
          git commit -m "data: archive actual ETF provider attempt $GITHUB_RUN_ID [skip ci]"
          for n in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo 'ETF_SOURCE_RECORD_PERSISTED'; exit 0
            fi
            sleep 2
          done
          echo 'ETF evidence push unavailable' >&2
          exit 2
      - name: Upload source evidence even on incomplete ETF data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nt-etf-actual-source-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            records/national_team_etf/
            records/national_team_merged/
            records/national_team_watch/
            records/national_team_events/
            records/national_team_paper/
            records/national_team_pcf/
            records/national_team_audits/
          if-no-files-found: warn
          retention-days: 90
