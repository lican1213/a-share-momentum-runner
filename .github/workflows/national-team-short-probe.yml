name: National-team A2-B source readiness probe (diagnostic only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'national_team/short_probe.py'
      - 'tests/test_national_team_short_probe.py'
      - '.github/workflows/national-team-short-probe.yml'
  schedule:
    # 16:40 Beijing, after today's stock close but before 18:15 freeze.
    - cron: '40 8 * * 1-5'
permissions:
  contents: write
concurrency:
  group: national-team-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install market source and test dependencies
        run: python -m pip install 'akshare>=1.17.0,<2' 'pandas>=2.2,<3' 'pytest>=8,<10' 'exchange-calendars==4.13.1'
      - name: Unit verify no freeze and only completed exchange session
        run: python -m pytest -q tests/test_national_team_short_probe.py
      - name: Run actual post-close source availability probe
        run: python -m national_team.short_probe
      - name: Archive probe evidence even when vendor reports missing quotes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ ! -d records/national_team_short_ab/probes ]; then
            echo "PROBE_MISSING_NO_ARCHIVABLE_SOURCE"; exit 2
          fi
          git add -A -- records/national_team_short_ab/probes/
          if git diff --cached --quiet; then echo 'NO_NEW_PROBE'; exit 0; fi
          git commit -m "data: independent prefreeze A2-B market source probe ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then echo PROBE_ARCHIVED; exit 0; fi
            sleep 3
          done
          exit 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prefreeze-market-probe-${{ github.run_id }}
          path: records/national_team_short_ab/probes/
          if-no-files-found: warn
          retention-days: 90
