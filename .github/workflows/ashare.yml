name: A-share live data integrity check
on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * 1-5'
    - cron: '30 4 * * 1-5'
    - cron: '30 9 * * 1-5'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Run validated data pipeline
        shell: bash
        run: |
          set -euo pipefail
          PHASE=close
          case "${{ github.event.schedule }}" in
            '30 0 * * 1-5') PHASE=pre ;;
            '30 4 * * 1-5') PHASE=mid ;;
            '30 9 * * 1-5') PHASE=close ;;
          esac
          python runner.py --phase "$PHASE" --out output
      - name: Upload auditable run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-share-run-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
