name: LLM Wiki MOC integrity
on:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'KNOWLEDGE.md'
      - 'MOC.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - '.github/copilot-instructions.md'
      - 'wiki/**'
      - '!wiki/indices/**'
      - '!wiki/compiled/**'
      - 'scripts/wiki_lint.py'
      - 'scripts/wiki_sync.py'
      - 'scripts/national_team_wiki.py'
      - 'tests/test_wiki_national_team_sync.py'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wiki:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check MOC graph, page metadata and internal links
        run: python scripts/wiki_lint.py
      - name: Verify national-team MOC generator on adversarial source fixtures
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q tests/test_wiki_national_team_sync.py
      - name: Reconstruct current second-brain views from actual persisted evidence
        run: |
          python scripts/wiki_sync.py
          python scripts/wiki_lint.py
      - name: Syntax check Wiki utilities
        run: python -m py_compile scripts/wiki_lint.py scripts/wiki_sync.py scripts/national_team_wiki.py
