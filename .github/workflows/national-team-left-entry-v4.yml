name: National-team EXP-0011 50pct low-left paper candidate freeze
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'national_team/left_entry_v4.py'
      - 'scripts/run_national_team_left_entry_v4.py'
      - 'tests/test_national_team_left_entry_v4.py'
      - '.github/workflows/national-team-left-entry-v4.yml'
permissions:
  contents: write
concurrency:
  group: national-team-v4-append-records
  cancel-in-progress: false
jobs:
  source-backed-paper-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public OHLC collection and tests
        run: python -m pip install 'pytest>=8,<10' 'akshare>=1.17,<2'
      - name: Regression and adversarial tests
        run: python -m pytest -q tests/test_national_team_left_entry_v4.py
      - name: Read pinned prior event and stock pool, collect date-aligned real OHLC
        shell: bash
        run: |
          python scripts/run_national_team_left_entry_v4.py \
            --v3 records/national_team_v3/2026-11-01/41281158666-a1.json \
            --watch records/national_team_watch/2026-10-31/41178966064-a1.json \
            --out "$RUNNER_TEMP/left-entry-v4.json" \
            --max-stocks 150
      - name: Check evidence gate and no fake future execution
        shell: bash
        run: |
          python - "$RUNNER_TEMP/left-entry-v4.json" <<'PY'
          import json,sys
          o=json.load(open(sys.argv[1],encoding="utf-8"))
          assert o["admission"]["pilot_admitted"] is True
          assert o["admission"]["five_day_wins"]==31
          assert o["admission"]["five_day_matured"]==59
          assert o["universe"]["ohlc_verified"]>=50, o["universe"]
          assert o["funding"]["primary_ordinary_float_ratio"] is None
          assert o["trade_authorized"] is False and o["broker_orders"]==[]
          assert not o["accounts"]["F1_LEFT"]["filled"]
          assert not o["accounts"]["F2_WEAK"]["filled"]
          assert o["measurement"]["labels"]=="UNMATURED_NO_ENTRY"
          assert len(o["accounts"]["F1_LEFT"]["orders"])<=2
          print("V4_RESEARCH_GATE_PASS",o["universe"],
                [x["stock"] for x in o["accounts"]["F1_LEFT"]["orders"]])
          PY
      - name: Append immutable frozen research intent and source OHLC
        shell: bash
        run: |
          RUN_DATE="$(date -u +%Y-%m-%d)"
          RECORD_DIR="records/national_team_left_entry/$RUN_DATE"
          RECORD_PATH="$RECORD_DIR/$GITHUB_RUN_ID-a$GITHUB_RUN_ATTEMPT.json"
          mkdir -p "$RECORD_DIR"
          test ! -e "$RECORD_PATH"
          cp "$RUNNER_TEMP/left-entry-v4.json" "$RECORD_PATH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$RECORD_PATH"
          git commit -m "records(v4): append real-OHLC low-left paper intent $GITHUB_RUN_ID-a$GITHUB_RUN_ATTEMPT"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
