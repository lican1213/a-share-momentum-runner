name: Original four-ETF funding indicators unit audit
on:
  push:
    branches: [main]
    paths:
      - 'national_team/**'
      - 'tests/test_national_team_factors.py'
      - '.github/workflows/national-team-factors.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  four-etf-arithmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest only
        run: python -m pip install pytest==8.4.2
      - name: Original 2026-10-27 indicator tests (synthetic fixtures only)
        run: python -m pytest -q tests/test_national_team_factors.py
      - name: Evidence classification
        run: |
          echo "These tests validate arithmetic and data gates only."
          echo "NO live ETF shares were fetched and NO state-backed entity trades were inferred."
