name: Real archived national-team evidence end-to-end red-team replay
on:
  push:
    branches: [main]
    paths:
      - 'tests/test_e2e_real_replay.py'
      - '.github/workflows/national-team-e2e-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-evidence-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test engine
        run: python -m pip install pytest==8.4.2
      - name: Replay original four-ETF real data, selected stocks, S1/S2 freeze and independent attack audit
        run: python -m pytest -v tests/test_e2e_real_replay.py
      - name: Check latest MOC and original records
        run: python scripts/wiki_lint.py
      - name: Output classification
        run: |
          echo 'REAL MARKET EVIDENCE AND CALCULATION PROVENANCE AUDIT, not actual broker fills or proven positive OOS alpha.'
