name: National-team EXP-0012 event router and self-iterating left-side paper
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'national_team/event_router_v5.py'
      - 'national_team/left_entry_v5.py'
      - 'scripts/run_national_team_event_router_v5.py'
      - 'scripts/run_national_team_left_entry_v5.py'
      - 'tests/test_national_team_event_router_v5.py'
      - '.github/workflows/national-team-event-router-v5.yml'
  schedule:
    - cron: '5 10 * * 1-5'
permissions:
  contents: write
concurrency:
  group: national-team-exp0012-daily-event
  cancel-in-progress: false
jobs:
  dispatch-event:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public OHLC source and tests
        run: python -m pip install 'pytest>=8,<10' 'akshare>=1.17,<2'
      - name: Check deterministic routing, rankings and legacy freezing
        run: python -m pytest -q tests/test_national_team_event_router_v5.py tests/test_national_team_left_entry_v4.py tests/test_national_team_left_entry_outcomes.py
      - name: Observe source event and select proven paper policy
        id: route
        shell: bash
        run: |
          python scripts/run_national_team_event_router_v5.py \
            --v3-root records/national_team_v3 \
            --watch-root records/national_team_watch \
            --freeze-root records/national_team_left_entry_v5 \
            --followup-root records/national_team_left_outcomes_v5 \
            --out "$RUNNER_TEMP/router.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Collect true as-of OHLC and freeze a NEW paper-only session
        if: ${{ steps.route.outputs.dispatch == 'true' }}
        shell: bash
        run: |
          python scripts/run_national_team_left_entry_v5.py \
            --v3 "${{ steps.route.outputs.v3_path }}" \
            --watch "${{ steps.route.outputs.watch_path }}" \
            --policy "${{ steps.route.outputs.selected_policy }}" \
            --max-stocks 150 \
            --out "$RUNNER_TEMP/left-v5.json"
          python - "$RUNNER_TEMP/left-v5.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding="utf-8"))
          assert j["experiment_id"]=="EXP-0012"
          assert j["trade_authorized"] is False and j["broker_orders"]==[]
          assert j["candidate_policy"] in ("SHALLOW_DIP","DEEP_DIP")
          assert j["paper_policies"]["SHALLOW_DIP"]
          assert j["paper_policies"]["DEEP_DIP"]
          assert all(x["fill"] is None for x in j["accounts"]["F1_LEFT"]["orders"])
          print("EXP0012_NEW_LOW_LEFT",j["signal_session"],
                j["universe"],j["candidate_policy"])
          PY
      - name: Append decision and optional source-pinned paper intent
        shell: bash
        run: |
          set -euo pipefail
          run_date="$(TZ=Asia/Shanghai date +%F)"
          base_name="$GITHUB_RUN_ID-a$GITHUB_RUN_ATTEMPT.json"
          mkdir -p "records/national_team_router/$run_date"
          cp "$RUNNER_TEMP/router.json" "records/national_team_router/$run_date/$base_name"
          git add -- "records/national_team_router/$run_date/$base_name"
          if test "${{ steps.route.outputs.dispatch }}" = "true"; then
            mkdir -p "records/national_team_left_entry_v5/$run_date"
            cp "$RUNNER_TEMP/left-v5.json" "records/national_team_left_entry_v5/$run_date/$base_name"
            git add -- "records/national_team_left_entry_v5/$run_date/$base_name"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "records(exp0012): route event and append paper evidence $GITHUB_RUN_ID [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo 'EXP0012_ROUTER_PERSISTED'
              exit 0
            fi
            sleep 2
          done
          exit 2
