name: National-team EXP-0011 prospective F1-F2 510300 OHLC paper tracker
on:
  workflow_dispatch:
  schedule:
    - cron: '40 9 * * 1-5'
permissions:
  contents: write
concurrency:
  group: national-team-v4-forward-records
  cancel-in-progress: false
jobs:
  paper-follow-up:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install live A-share and ETF OHLC reader
        run: python -m pip install 'pytest>=8,<10' 'akshare>=1.17,<2'
      - name: Validate future-date, T-plus-one, fee and S0 matching cases
        run: python -m pytest -q tests/test_national_team_left_entry_outcomes.py tests/test_national_team_left_entry_v4.py
      - name: Re-evaluate a frozen intent using observed later daily bars
        run: |
          python scripts/track_national_team_left_entry_v4.py \
            --freeze-root records/national_team_left_entry \
            --out "$RUNNER_TEMP/v4-followup.json"
      - name: Fail on manufactured brokerage or rewritten freeze
        run: |
          python - "$RUNNER_TEMP/v4-followup.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding="utf-8"))
          assert j["trade_authorized"] is False
          assert j["broker_orders"]==[]
          assert j["source_freeze_sha256"]
          assert j["source_new_ohlc_sha256"]
          assert j["execution_assertion"]=="OHLC_OPEN_SCENARIO_NOT_AN_EXECUTED_TRADE"
          print("EXP0011_FORWARD_EVIDENCE",j["asof"],
                [x["status"] for x in j["F1_LEFT"]],
                [x["status"] for x in j["F2_WEAK"]])
          PY
      - name: Append immutable actual-source forward scenario
        shell: bash
        run: |
          RUN_DATE="$(date -u +%Y-%m-%d)"
          RECORD_DIR="records/national_team_left_outcomes/$RUN_DATE"
          RECORD_PATH="$RECORD_DIR/$GITHUB_RUN_ID-a$GITHUB_RUN_ATTEMPT.json"
          mkdir -p "$RECORD_DIR"
          test ! -e "$RECORD_PATH"
          cp "$RUNNER_TEMP/v4-followup.json" "$RECORD_PATH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$RECORD_PATH"
          git commit -m "records(v4): append F1/F2 forward OHLC scenario $GITHUB_RUN_ID-a$GITHUB_RUN_ATTEMPT"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
