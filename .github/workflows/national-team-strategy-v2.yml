name: National-team V2 frozen stock strategy from verified four ETF evidence
on:
  push:
    branches: [main]
    paths:
      - 'national_team/strategy_v2.py'
      - 'tests/test_national_team_strategy_v2.py'
      - '.github/workflows/national-team-strategy-v2.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * 2-6'
permissions:
  contents: write
concurrency:
  group: national-team-strategy-v2-main
  cancel-in-progress: false
jobs:
  source-backed-four-etf-stock-cohorts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest==8.4.2
      - name: Adversarial tests and real archived market source replay
        run: |
          python -m pytest -q tests/test_national_team_strategy_v2.py tests/test_national_team_forward_evaluation.py
      - name: Freeze first eligible NEW strategy event with original source observations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess
          root=pathlib.Path("records/national_team_watch")
          valid=[]
          for p in root.glob("*/*.json"):
              try:
                  d=json.loads(p.read_text(encoding="utf-8"))
                  m=pathlib.Path(d.get("etf_evidence_path",""))
                  if d.get("status")!="INDEX_PROXY_RESEARCH_WATCHLIST" or not m.is_file():
                      continue
                  matching=json.loads(m.read_text(encoding="utf-8"))
                  if matching.get("run_id") != d.get("run_id"):
                      continue
                  valid.append((d["event_first_public_no_earlier_than"],str(p),str(m)))
              except (ValueError, OSError, KeyError, TypeError):
                  continue
          if not valid:
              raise SystemExit("NO_ACTUAL_PROVENANCE_MATCHED_WATCH: no synthetic fallback")
          stamp,watch,merged=max(valid)
          print("Real inputs",watch,merged,stamp)
          subprocess.run(["python","-m","national_team.strategy_v2",
             "--watch",watch,"--merged",merged],check=True)
          PY
      - name: Validate archived frozen signal reproducibility
        run: |
          python - <<'PY'
          import json,os,pathlib
          rid=os.environ["GITHUB_RUN_ID"]
          matches=list(pathlib.Path("records/national_team_strategy").glob(f"*/{rid}-a*-v2.json"))
          assert len(matches)==1, matches
          report=json.loads(matches[0].read_text(encoding="utf-8"))
          assert report["paper_only"] and not report["trade_authorized"] and report["benchmark"]=="510300"
          assert report["source_watch"].startswith("records/national_team_watch/")
          assert report["source_merged"].startswith("records/national_team_merged/")
          assert report["flow_scope"]=="FULL_CORE_FOUR" or not report.get("frozen_candidate_cohorts")
          events=list(pathlib.Path("records/national_team_events").glob(f"*/{rid}-a*-v2.json"))
          assert len(events)==1
          data=json.loads(events[0].read_text(encoding="utf-8"))
          assert all(x["first_public_at"] >= report["strategy_first_public_at"]
                     and not x["broker_trades_authorized"] for x in data["events"])
          print(json.dumps({"status":report["status"],"s1":[x["symbol"] for x in report.get("s1_ranked",[])],
                            "s2":[x["symbol"] for x in report.get("s2_ranked",[])],
                            "new_events":len(data["events"]),"flow_cny":report.get("four_etf_flow_cny")}))
          PY
      - name: Commit source-backed evidence without touching derived Wiki
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- records/national_team_strategy/ records/national_team_events/
          git commit -m "data: archived four-ETF V2 candidate freeze ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo 'V2_STRATEGY_FROZEN_AND_ARCHIVED'
              exit 0
            fi
            sleep 2
          done
          exit 2
      - name: Upload evidence even when provider is down
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: national-team-v2-strategy-${{ github.run_id }}
          path: |
            records/national_team_strategy/
            records/national_team_events/
          if-no-files-found: warn
          retention-days: 90
